<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Análise de Saldo de Frequência</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    /* ação e navegação */
    --acao:#213D87; --acao-esc:#192f6a; --acao-bg:#EDF0F8;
    /* colunas de horas */
    --contr:#8A94A8; --contr-bg:#F2F4F8; --contr-cel:#F8F9FB;
    --esc:#213D87;   --esc-bg:#EDF0F8;   --esc-cel:#F6F8FC;
    --cons:#32A347;  --cons-bg:#EAF6EC;  --cons-cel:#F5FAF6;
    /* saldo */
    --pos:#154899; --neg:#A84A08; --neg-bar:#F7751C;
    /* estados */
    --aj:#B3261E; --aj-bg:#FBE4E3; --aj-bd:#F2B8B5; --aj-row:#FFF7F6;
    --ver:#7A5A00; --ver-bd:#E9C75A; --ver-bg:#FEF4CC;
    --inf:#3D4A66; --inf-bg:#EEF2F8;
    --ok:#1E6B30; --ok-bg:#EAF6EC;
    --afa:#7A5A00; --afa-bg:#FEF4CC;
    /* neutros */
    --bg:#F4F6FA; --sup:#FFFFFF; --bd:#DCE2EC; --bd2:#E7ECF3; --bd-ctl:#C5CFDF;
    --txt:#172340; --txt2:#4F5B75; --txt3:#3D4A66; --cab:#FAFBFD;
    --font:'Montserrat', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--font);font-size:14px;line-height:1.5}
  .n{font-variant-numeric:tabular-nums;white-space:nowrap}
  .hidden{display:none !important}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  a{color:var(--acao)} a:hover{color:var(--acao-esc)}
  h1,h2,h3,p{margin:0}
  .wrap{max-width:1200px;margin:0 auto;padding-left:32px;padding-right:32px}
  .muted{color:var(--txt2)}
  .pos{color:var(--pos)} .neg{color:var(--neg)} .zero{color:var(--txt2)}
  :focus-visible{outline:3px solid #8EA3C8;outline-offset:2px}

  .btn{font-family:inherit;font-size:14px;font-weight:600;min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--bd-ctl);background:var(--sup);color:var(--acao);display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;text-decoration:none;white-space:nowrap}
  .btn:hover{background:var(--acao-bg)}
  .btn.pri{background:var(--acao);border-color:var(--acao);color:#fff}
  .btn.pri:hover{background:var(--acao-esc)}
  .btn.sm{min-height:36px;padding:0 12px;font-size:13px}
  .lnk{background:none;border:none;padding:0;font:inherit;font-weight:700;font-size:13px;color:var(--acao);cursor:pointer;text-decoration:underline}

  .chip{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;border:1px solid transparent;line-height:1.5}
  .c-aj{background:var(--aj-bg);color:var(--aj);border-color:var(--aj-bd)}
  .c-ver{background:#fff;color:var(--ver);border-color:var(--ver-bd)}
  .c-inf{background:var(--inf-bg);color:var(--inf);border-color:var(--bd)}
  .c-ok{background:var(--inf-bg);color:var(--txt3)}
  .c-afa{background:var(--afa-bg);color:var(--afa)}
  .c-pag{background:#fff;color:var(--txt3);border:1px dashed var(--contr)}
  .c-pla{background:#fff;color:var(--txt);border-color:var(--bd-ctl)}
  .c-des{background:var(--bg);color:var(--txt2)}
  .badge{font-size:11px;font-weight:700;border-radius:999px;padding:0 7px;line-height:18px}
  .b-aj{background:var(--aj);color:#fff}
  .b-ver{background:var(--ver-bg);color:var(--ver);border:1px solid var(--ver-bd);line-height:16px}

  .panel{background:var(--sup);border:1px solid var(--bd);border-radius:8px;overflow:hidden}
  .panel-h{padding:16px 20px 8px;display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
  .panel-h h2{font-size:16px;font-weight:700}
  .panel-f{padding:12px 20px;font-size:13px;color:var(--txt2);border-top:1px solid var(--bd2);background:var(--cab)}

  /* topo */
  .top{background:var(--sup);border-bottom:1px solid var(--bd)}
  .top-bar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:12px;padding-bottom:12px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;color:var(--acao)}
  .brand .mark{width:32px;height:32px;border-radius:8px;background:var(--acao);display:inline-flex;align-items:center;justify-content:center}
  .acts{display:flex;gap:8px}
  .ctx{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-top:4px}
  .ctx-l{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;min-width:0}
  .ctx h1{font-size:20px;font-weight:700;line-height:1.3}
  .ctx-meta{font-size:13px;color:var(--txt2);font-variant-numeric:tabular-nums}
  .ctx-r{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .ctx-r .comp{font-size:14px;font-weight:700}
  .tabs{display:flex;gap:4px;overflow-x:auto;margin-top:6px}
  .tab{font-family:inherit;background:none;border:none;border-bottom:3px solid transparent;padding:12px 16px;font-size:14px;font-weight:600;color:var(--txt2);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
  .tab[aria-selected="true"]{color:var(--acao);font-weight:700;border-bottom-color:var(--acao)}
  .tab .curto,.brand .curto{display:none}
  .page{padding-top:24px;padding-bottom:48px;display:flex;flex-direction:column;gap:20px}

  /* tabelas */
  .tbox{overflow-x:auto}
  table.t{width:100%;border-collapse:collapse}
  table.t th,table.t td{padding:10px 12px;border-bottom:1px solid var(--bd2);font-size:14px;text-align:left;vertical-align:top}
  table.t thead th{font-size:12px;font-weight:700;color:var(--txt2);background:var(--cab);border-bottom:1px solid var(--bd);white-space:nowrap;vertical-align:bottom}
  table.t .r{text-align:right}
  th.h-contr{border-top:3px solid var(--contr);background:var(--contr-bg) !important}
  th.h-esc{border-top:3px solid var(--esc);background:var(--esc-bg) !important}
  th.h-cons{border-top:3px solid var(--cons);background:var(--cons-bg) !important}
  th.h-sal{border-top:3px solid var(--txt)}
  td.v-contr{background:var(--contr-cel)} td.v-esc{background:var(--esc-cel)} td.v-cons{background:var(--cons-cel)}
  td.v-sal{font-weight:700}
  table.t tfoot td{font-weight:700;border-top:1.5px solid var(--txt);border-bottom:none}
  table.t tfoot td.v-contr{background:var(--contr-bg)} table.t tfoot td.v-esc{background:var(--esc-bg)} table.t tfoot td.v-cons{background:var(--cons-bg)}
  table.t tr.sub td{font-weight:700;background:var(--bg);border-bottom:1px solid var(--bd)}
  table.t tr.r-aj{background:var(--aj-row)}
  table.t tr.r-desc th,table.t tr.r-desc td{color:var(--txt2)}
  table.t tr.flash{animation:flash 2s ease}
  @keyframes flash{0%,40%{background:#FFF2B8}100%{background:inherit}}
  table.t tbody th{font-weight:600;white-space:nowrap}
  .clk{cursor:pointer} .clk:hover td,.clk:hover th{background-color:#F7F9FD}

  /* importação */
  .drop{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding:20px 24px;border:2px dashed #8EA3C8;border-radius:8px;background:var(--sup);cursor:pointer;position:relative;transition:background .15s}
  .drop.over{background:var(--acao-bg);border-color:var(--acao)}
  .drop .ico{width:48px;height:48px;border-radius:999px;background:var(--acao-bg);display:flex;align-items:center;justify-content:center;flex:none}
  .drop .txt{flex:1;min-width:240px;display:flex;flex-direction:column;gap:2px}
  .drop strong{font-size:16px}
  .prog{flex:1;max-width:320px;height:6px;background:var(--inf-bg);border-radius:999px;overflow:hidden}
  .prog div{height:100%;background:var(--acao);transition:width .2s}
  input[type=search]{font-family:inherit;font-size:14px;min-height:40px;padding:0 12px;border:1px solid var(--bd-ctl);border-radius:8px;width:220px;max-width:100%}

  /* resumo */
  .alert{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:8px;background:var(--aj-bg);color:var(--aj);font-size:14px;flex-wrap:wrap}
  .alert svg{flex:none}
  .alert span{flex:1;min-width:220px}
  .tot{display:flex;flex-wrap:wrap}
  .tot > div{flex:1 1 210px;padding:18px 20px;border-right:1px solid var(--bd2)}
  .tot > div:last-child{border-right:none}
  .tot .k{font-size:12px;font-weight:600;color:var(--txt2);display:flex;align-items:center;gap:6px}
  .tot .k i{width:10px;height:10px;border-radius:2px;display:inline-block}
  .tot .v{font-size:24px;font-weight:700;line-height:1.3}
  .tot .v.big{font-size:36px;font-weight:800;line-height:1.1}
  .tot .s{font-size:12px;color:var(--txt2)}
  .conta-saldo{list-style:none;margin:0;padding:4px 20px}
  .conta-saldo li{display:grid;grid-template-columns:96px 1fr;gap:16px;padding:12px 0;border-bottom:1px solid var(--bd2);align-items:baseline}
  .conta-saldo li:last-child{border-bottom:none}
  .conta-saldo .val{font-size:18px;font-weight:800;text-align:right}
  .conta-saldo .warn{margin-top:6px;display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--aj);background:var(--aj-bg);border-radius:6px;padding:3px 8px}
  .conta-tot{display:grid;grid-template-columns:96px 1fr;gap:16px;padding:14px 20px;border-top:2px solid var(--txt);background:var(--cab);align-items:baseline}
  .conta-tot .val{font-size:22px;font-weight:800;text-align:right}

  /* semanas */
  .wsel{display:flex;gap:6px;flex-wrap:wrap}
  .wsel button{font-family:inherit;cursor:pointer;min-height:52px;padding:6px 12px;border-radius:8px;border:1px solid var(--bd);background:var(--sup);text-align:left;display:flex;flex-direction:column;gap:1px}
  .wsel button[aria-pressed="true"]{border:2px solid var(--acao);background:var(--acao-bg)}
  .wsel .nm{font-size:13px;font-weight:700;color:var(--txt)}
  .wsel .sv{font-size:12px;font-weight:700}
  .seg{display:flex;border:1px solid var(--bd-ctl);border-radius:8px;overflow:hidden}
  .seg button{font-family:inherit;font-size:13px;font-weight:600;min-height:40px;padding:0 14px;border:none;background:var(--sup);color:var(--acao);cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--acao);color:#fff;font-weight:700}
  .wk-h{padding:14px 20px;display:flex;align-items:center;gap:10px 20px;flex-wrap:wrap;border-bottom:1px solid var(--bd2)}
  .wk-h h2{font-size:16px;font-weight:700}
  .obs-cell{font-size:13px;color:var(--txt3);display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
  .m-tag{font-size:10px;font-weight:700;color:var(--neg);background:#FDEBDD;border-radius:3px;padding:0 4px;line-height:16px}
  .dlist{display:none;list-style:none;margin:0;padding:0}
  .cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;padding:16px 20px}
  .cal .dow{font-size:12px;font-weight:700;color:var(--txt2)}
  .cell{min-height:104px;border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;border:1px solid var(--bd2);background:var(--bg);font-size:12px}
  .cell.blank{background:transparent;border:1px dashed var(--bd2)}
  .cell.plantao{background:#fff;border:1.5px solid var(--bd-ctl)}
  .cell.pag{background:#fff;border:1.5px dashed var(--contr)}
  .cell.afast,.cell.feriado{background:var(--afa-bg);border-color:#F0D676}
  .cell.aj{border:2px solid var(--aj)}
  .cell .ct{display:flex;justify-content:space-between;gap:4px;font-weight:700}
  .cell .cd{font-size:14px}
  .cell .cy{font-weight:600;color:var(--txt3)}
  .cell .ch{margin-top:auto;display:flex;gap:6px;font-size:12px}

  /* dia a dia */
  th.gh-esta{background:#F3F4F7 !important;text-align:center !important;border-bottom:none !important;font-size:11px !important;letter-spacing:.05em}
  th.gh-dev{background:var(--acao-bg) !important;color:var(--acao) !important;text-align:center !important;border-bottom:none !important;font-size:11px !important;letter-spacing:.05em}
  th.g-esta{background:#F3F4F7 !important} th.g-dev{background:var(--acao-bg) !important}
  td.g-esta{background:#FAFAFB} td.g-dev{background:#F7F9FD}
  td.g-dev:first-of-type,th.g-dev:first-of-type{border-left:2px solid var(--bd)}
  td.cel-err{background:var(--aj-bg) !important;color:var(--aj) !important;font-weight:700}
  td.cel-ok,span.cel-ok{color:var(--pos) !important;font-weight:800}
  span.cel-err{color:var(--aj);font-weight:700}
  .bt{display:inline-flex;flex-wrap:wrap;gap:4px}
  .b{display:inline-flex;align-items:center;gap:3px;padding:1px 6px;border-radius:4px;background:#fff;border:1px solid var(--bd);font-size:13px;font-variant-numeric:tabular-nums}
  .b small{font-size:10px;font-weight:700}
  .b.ant{background:var(--inf-bg);color:var(--txt2);border-color:var(--inf-bg)}
  .b.dup{background:var(--aj-bg);color:var(--aj);border-color:var(--aj-bd)}
  .b.canc{text-decoration:line-through;color:#9AA3B5}
  .cmp2{display:grid;grid-template-columns:62px 1fr 48px 56px;gap:6px;align-items:center;font-size:13px}
  .cmp2 .lb{font-size:11px;font-weight:700;color:var(--txt2)}
  .cmp2 > span:nth-child(3),.cmp2 > span:nth-child(4){text-align:right}

  /* pontos */
  .filt{display:flex;gap:8px;flex-wrap:wrap}
  .filt button{font-family:inherit;cursor:pointer;min-height:40px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:700;border:1px solid var(--bd);background:#fff;color:var(--txt3)}
  .filt button[data-f="ajustar"]{border-color:var(--aj-bd);background:var(--aj-bg);color:var(--aj)}
  .filt button[data-f="verificar"]{border-color:var(--ver-bd);color:var(--ver)}
  .filt button[aria-pressed="true"]{outline:2px solid var(--acao);outline-offset:1px}
  .grp-t{font-size:12px;font-weight:700;color:var(--txt2);letter-spacing:.04em;margin-top:4px}
  .pc{background:#fff;border:1px solid var(--bd);border-radius:8px;overflow:hidden}
  .pc.aj{border-color:var(--aj-bd)}
  .pc-h{padding:14px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--bd2)}
  .pc.aj .pc-h{background:var(--aj-row);border-bottom-color:#F6D4D2}
  .pc-h .dt{font-size:13px;font-weight:700;color:var(--txt2)}
  .pc-h h3{font-size:17px;font-weight:700;flex:1;min-width:260px}
  .pc-b{display:flex;flex-wrap:wrap}
  .pc-b > div{flex:1 1 260px;padding:16px 20px;border-right:1px solid var(--bd2)}
  .pc-b > div:nth-child(2){flex:1.4 1 340px}
  .pc-b > div:last-child{border-right:none}
  .pc-l{font-size:12px;font-weight:700;color:var(--acao);margin-bottom:8px;letter-spacing:.03em}
  .pc-ref{margin-top:8px;font-size:12px;color:var(--txt2)}
  .pc-f{padding:10px 20px;font-size:13px;background:var(--cab);border-top:1px solid var(--bd2)}
  .bat{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
  .bat li{padding:5px 10px;border-radius:6px;font-size:13px}
  .bat .ok{background:var(--cons-bg)} .bat .erro{background:var(--aj-bg);color:var(--aj)} .bat .neutro{background:var(--inf-bg);color:var(--txt3)}
  .cta{width:100%;border-collapse:collapse;font-size:14px}
  .cta td{padding:3px 0}
  .cta td:last-child{text-align:right}
  .cta .t-norm td:first-child{color:var(--txt2)}
  .cta .t-sub td{border-top:1px solid var(--bd);font-weight:700;padding-top:6px}
  .cta .t-total td{border-top:2px solid var(--txt);font-weight:800;padding-top:6px}
  .cta .t-erro td:last-child{color:var(--aj);font-weight:700}
  .fx{display:flex;height:32px;border-radius:6px;overflow:hidden;font-size:11px;font-weight:700}
  .fx div{display:flex;align-items:center;justify-content:center;border-right:2px solid #fff;white-space:nowrap;overflow:hidden;padding:0 4px;min-width:0}
  .fx .plantao{background:var(--acao);color:#fff} .fx .descanso{background:var(--aj-bg);color:var(--aj)}
  .fx .janela{background:var(--acao-bg);color:var(--acao)} .fx .fora{background:#D5332C;color:#fff}
  .fx-n{margin-top:8px;font-size:13px}
  .pl-top{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--txt2)}
  .pl-top strong{color:var(--txt)}
  .pl-bar{height:10px;border-radius:999px;background:var(--cons);margin:6px 0 4px}
  .cmp{margin-top:14px;display:grid;grid-template-columns:110px 1fr 56px;gap:6px 10px;align-items:center;font-size:13px}
  .cmp .tr{height:12px;background:var(--inf-bg);border-radius:3px;overflow:hidden}
  .cmp .tr div{height:100%;border-radius:3px}
  .info-row{background:#fff;border:1px solid var(--bd);border-radius:8px;padding:12px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .info-row .tx{flex:1;min-width:240px}

  /* conferência */
  .conf-wrap{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
  .conf-wrap > .panel:first-child{flex:3 1 520px}
  .conf-wrap > .panel:last-child{flex:2 1 320px;padding:16px 20px}
  .regras{margin:0;display:grid;grid-template-columns:120px 1fr;gap:8px 12px;font-size:13px}
  .regras dt{font-weight:700} .regras dd{margin:0;color:var(--txt3)}

  /* painel do resumo */
  .overlay{position:fixed;inset:0;background:rgba(23,35,64,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
  .modal{background:#fff;border-radius:12px;width:min(680px,100%);max-height:calc(100vh - 40px);display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(23,35,64,.25)}
  .modal-h{padding:16px 20px;border-bottom:1px solid var(--bd2);display:flex;justify-content:space-between;align-items:center;gap:12px}
  .modal-h h2{font-size:18px;font-weight:700}
  .modal-b{padding:16px 20px;overflow:auto;display:flex;flex-direction:column;gap:8px}
  .modal textarea{width:100%;min-height:340px;font-family:inherit;font-size:14px;line-height:1.55;padding:12px;border:1px solid var(--bd-ctl);border-radius:8px;resize:vertical;color:var(--txt)}
  .modal-f{padding:14px 20px;border-top:1px solid var(--bd2);display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--txt);color:#fff;padding:12px 18px;border-radius:8px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}

  /* celular */
  @media (max-width:720px){
    .wrap{padding-left:16px;padding-right:16px}
    .acts .btn .lbl{display:none}
    .acts .btn{width:44px;padding:0}
    .brand{font-size:15px}
    .ctx h1{font-size:17px}
    .ctx-meta{font-size:12px}
    .tabs{gap:0}
    .tab{flex:1;justify-content:center;padding:12px 4px;font-size:13px}
    .tab .longo,.brand .longo{display:none} .tab .curto,.brand .curto{display:inline}
    .page{padding-top:16px;gap:16px}
    .tot > div{flex:1 1 45%;padding:14px 16px;border-right:none;border-bottom:1px solid var(--bd2)}
    .tot .v.big{font-size:28px}
    .conta-saldo{padding:4px 14px}
    .conta-saldo li,.conta-tot{grid-template-columns:72px 1fr;gap:10px}
    .conta-saldo .val{font-size:15px}
    .conta-tot{padding:12px 14px}
    .wsel{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px;padding:0 16px 4px}
    .wsel button{flex:none}
    .tbl-dias{display:none}
    .dlist{display:block}
    .dlist li{padding:10px 14px;border-bottom:1px solid var(--bd2);display:flex;flex-direction:column;gap:4px}
    .dlist li.r-aj{background:var(--aj-row)}
    .dl-h{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px}
    .dl-v{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;font-size:13px}
    .dl-v span{border-radius:4px;padding:2px 6px}
    .dl-cab{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding:8px 14px;background:var(--cab);border-bottom:1px solid var(--bd2);font-size:11px;font-weight:700;color:var(--txt2)}
    .dl-cab span{padding-top:3px}
    .cal{display:none}
    .pc-b > div{border-right:none;border-bottom:1px solid var(--bd2)}
    .pc-h h3{font-size:15px;min-width:0;flex-basis:100%;order:3}
    .wk-h{padding:12px 14px}
  }
  @media print{.acts,.tabs,.seg,.filt,#vImport{display:none !important} body{background:#fff}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap top-bar">
    <div class="brand">
      <span class="mark" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>
      <span class="longo">Análise de Saldo de Frequência</span><span class="curto">Análise de Saldo</span>
    </div>
    <div class="acts hidden" id="acts">
      <button class="btn" id="btnRel" aria-label="Relatórios">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
        <span class="lbl">Relatórios</span>
      </button>
      <button class="btn pri" id="btnResumo" aria-label="Resumo para o empregado">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a1 1 0 0 1 1-1h10"/></svg>
        <span class="lbl">Resumo para o empregado</span>
      </button>
    </div>
  </div>
  <div class="wrap hidden" id="ctxWrap">
    <div class="ctx" id="ctx"></div>
    <div class="tabs" role="tablist" aria-label="Abas da análise" id="tabs"></div>
  </div>
</header>

<!-- RELATÓRIOS / IMPORTAÇÃO -->
<main id="vImport" class="wrap page">
  <div>
    <h1 style="font-size:24px;font-weight:800;color:var(--acao)">Relatórios</h1>
    <p class="muted" style="margin-top:4px">Importe o Relatório de Frequência em PDF para ver o saldo explicado.</p>
  </div>
  <label class="drop" id="drop" tabindex="0">
    <span class="ico" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#213D87" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg></span>
    <span class="txt">
      <strong>Arraste os PDFs ou escolha os arquivos</strong>
      <span class="muted" style="font-size:13px">MentorH › Ponto Eletrônico – Relatório de Frequência. Aceita vários arquivos. Nada é enviado: o PDF é lido no navegador.</span>
    </span>
    <span class="btn pri" aria-hidden="true">Escolher arquivos</span>
    <input type="file" id="file" accept="application/pdf,.pdf" multiple class="sr">
  </label>
  <section class="panel hidden" id="impPanel">
    <div class="panel-h" style="padding-bottom:12px;border-bottom:1px solid var(--bd2)">
      <h2>Importados <span class="n muted" style="font-weight:500" id="impResumo"></span></h2>
      <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--txt2)">Buscar <input type="search" id="busca" placeholder="Nome ou matrícula"></label>
    </div>
    <div class="tbox">
      <table class="t" style="min-width:880px">
        <caption class="sr">Relatórios importados</caption>
        <thead><tr><th scope="col">Empregado</th><th scope="col">Competência</th><th scope="col" class="r h-sal">Saldo</th><th scope="col">Pontos de atenção</th><th scope="col">Arquivo</th><th scope="col"><span class="sr">Ação</span></th></tr></thead>
        <tbody id="impBody"></tbody>
      </table>
    </div>
  </section>
</main>

<!-- ANÁLISE -->
<main id="vRes" class="wrap page hidden"></main>

<div class="overlay hidden" id="overlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <div class="modal-h">
      <h2 id="mTitle">Resumo para o empregado</h2>
      <button class="btn sm" id="btnFechar" aria-label="Fechar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="modal-b">
      <label for="resumoTxt" class="muted" style="font-size:13px;font-weight:600">Revise ou ajuste o texto antes de copiar.</label>
      <textarea id="resumoTxt"></textarea>
    </div>
    <div class="modal-f">
      <button class="btn" id="btnCancelar">Fechar</button>
      <button class="btn pri" id="btnCopiar">Copiar texto</button>
    </div>
  </div>
</div>
<div id="toast" class="toast hidden" role="status"></div>

<script type="module">
import { lerRelatorio, analisar, fmt, DIAS_NOME, MESES } from './parser.js';

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dd = n => String(n).padStart(2, '0');
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;
const plural = (n, s, p) => n === 1 ? s : p;
const sinal = m => m == null ? '' : (m > 0 ? '+' : m < 0 ? '−' : '') + fmt(Math.abs(m));
const cls = m => m > 0 ? 'pos' : m < 0 ? 'neg' : 'zero';
const ICO_W = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9.5 17h-19z"/><path d="M12 10v4M12 17h.01"/></svg>';
const DOWC = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
const CONECT = new Set(['de','da','do','das','dos','e','em','para','a','o']);
const titulo = s => String(s || '').toLowerCase().split(/(\s+)/).map((w, i) => (i > 0 && CONECT.has(w)) ? w : w.replace(/^\p{L}/u, c => c.toUpperCase())).join('');
const NIVEL = { ajustar: ['c-aj', 'Ajustar'], verificar: ['c-ver', 'Verificar'], info: ['c-inf', 'Informação'] };

// ---------- leitura do PDF ----------
let pdfjs = null;
async function loadPdfjs() {
  if (pdfjs) return pdfjs;
  pdfjs = await import('./pdf.min.js');
  try { await import('./pdf.worker.min.js'); } catch (e) { /* usa worker separado */ }
  pdfjs.GlobalWorkerOptions.workerSrc = './pdf.worker.min.js';
  return pdfjs;
}
async function lerPdf(file, onPage) {
  const lib = await loadPdfjs();
  const doc = await lib.getDocument({ data: new Uint8Array(await file.arrayBuffer()), isEvalSupported: false, verbosity: 0 }).promise;
  const pages = [];
  for (let p = 1; p <= doc.numPages; p++) {
    onPage && onPage(p, doc.numPages);
    const tc = await (await doc.getPage(p)).getTextContent();
    pages.push(tc.items.map(i => ({ str: i.str, x: i.transform[4], y: i.transform[5] })));
  }
  return pages;
}

// ---------- estado ----------
let fila = [], relatorios = [], seq = 0;
let A = null, idxAtual = -1, aba = 'resumo', semSel = 0, modoDias = 'tab', filtro = 'todos';

// ---------- importação ----------
function contagem(issues) {
  const aj = issues.filter(i => i.nivel === 'ajustar').length, ver = issues.filter(i => i.nivel === 'verificar').length;
  return { aj, ver };
}
function renderImport() {
  $('impPanel').classList.toggle('hidden', !fila.length);
  const n = k => fila.filter(f => f.estado === k).length;
  const prontos = relatorios.length;
  $('impResumo').textContent = '· ' + [prontos ? `${prontos} ${plural(prontos, 'pronto', 'prontos')}` : '', n('lendo') ? `${n('lendo')} lendo` : '', n('erro') ? `${n('erro')} com problema` : ''].filter(Boolean).join(' · ');
  const q = ($('busca').value || '').toLowerCase().trim();
  const linhas = [];
  fila.forEach(f => {
    if (f.estado === 'lendo') linhas.push(`<tr><td colspan="4"><div style="display:flex;align-items:center;gap:12px"><span class="muted" style="font-size:13px;white-space:nowrap">${f.total ? `Lendo página ${f.pag} de ${f.total}` : 'Abrindo arquivo…'}</span><div class="prog"><div style="width:${f.total ? Math.round(f.pag / f.total * 100) : 5}%"></div></div></div></td><td class="muted" style="font-size:13px">${esc(f.nome)}</td><td></td></tr>`);
    else if (f.estado === 'erro') linhas.push(`<tr style="background:var(--aj-row)"><td colspan="4" style="font-size:13px;color:var(--aj)"><span style="display:inline-flex;gap:8px;align-items:center">${ICO_W}${esc(f.msg)}</span></td><td class="muted" style="font-size:13px">${esc(f.nome)}</td><td class="r"><button class="btn sm" data-rem="${f.id}">Remover</button></td></tr>`);
    else f.rels.forEach(r => {
      if (q && !(r.emp.nome.toLowerCase().includes(q) || r.emp.matricula.includes(q))) return;
      const c = contagem(r.A.issues), k = relatorios.indexOf(r);
      const pts = [c.aj ? `<span class="n" style="font-size:12px;font-weight:700;color:var(--aj)">${c.aj} ajustar</span>` : '', c.ver ? `<span class="n" style="font-size:12px;font-weight:700;color:var(--ver)">${c.ver} verificar</span>` : ''].filter(Boolean).join(' · ') || '<span class="muted" style="font-size:12px">nenhum</span>';
      linhas.push(`<tr><td><div style="font-weight:700">${esc(titulo(r.emp.nome))}</div><div class="n muted" style="font-size:12px">Mat. ${esc(r.emp.matricula)} · ${esc(titulo((r.emp.cargo.split(' - ')[0] || '').trim()))}</div></td>
        <td>${cap(MESES[r.emp.mes])}/${r.emp.ano}</td><td class="r n v-sal ${cls(r.A.M.saldo)}">${sinal(r.A.M.saldo) || '00:00'}</td><td>${pts}</td>
        <td class="muted" style="font-size:13px">${esc(r.arquivo)}<div style="font-size:11px">${r.emp.tipo === 'espelho' ? 'Espelho de Ponto' : 'Relatório de Frequência'}</div></td><td class="r"><button class="btn sm" data-abrir="${k}">Abrir</button></td></tr>`);
    });
  });
  $('impBody').innerHTML = linhas.join('') || '<tr><td colspan="6" class="muted">Nenhum relatório encontrado.</td></tr>';
}
$('impBody').addEventListener('click', e => {
  const ab = e.target.closest('[data-abrir]'), rm = e.target.closest('[data-rem]');
  if (ab) abrir(+ab.dataset.abrir);
  if (rm) { fila = fila.filter(f => f.id !== +rm.dataset.rem); renderImport(); }
});
$('busca').addEventListener('input', renderImport);

async function importar(files) {
  files = [...files];
  if (!files.length) return;
  const itens = files.map(f => ({ id: ++seq, nome: f.name, estado: 'lendo', pag: 0, total: 0, rels: [], file: f }));
  fila.push(...itens); renderImport();
  for (const it of itens) {
    const f = it.file;
    if (!(/\.pdf$/i.test(f.name) || f.type === 'application/pdf')) {
      it.estado = 'erro';
      it.msg = /\.(xlsx?|xlsm|csv|ods)$/i.test(f.name) ? 'É uma planilha. Envie o PDF do Relatório de Frequência.' : 'Formato não aceito. Envie o PDF do Relatório de Frequência.';
      renderImport(); continue;
    }
    try {
      const pages = await lerPdf(f, (p, t) => { it.pag = p; it.total = t; renderImport(); });
      const emps = lerRelatorio(pages).filter(e => e.mes != null && e.ano && Object.keys(e.dias).length);
      if (!emps.length) { it.estado = 'erro'; it.msg = 'Não encontrei a tabela diária do Relatório de Frequência neste PDF.'; }
      else { it.estado = 'pronto'; emps.forEach(e => { const r = { arquivo: f.name, emp: e, A: analisar(e) }; relatorios.push(r); it.rels.push(r); }); }
    } catch (err) { console.error(err); it.estado = 'erro'; it.msg = 'Não foi possível ler este PDF. Ele pode estar protegido ou corrompido.'; }
    renderImport();
  }
  const prontos = itens.filter(i => i.estado === 'pronto');
  if (prontos.length === 1 && prontos[0].rels.length === 1 && itens.every(i => i.estado !== 'erro') && relatorios.length === 1) abrir(relatorios.indexOf(prontos[0].rels[0]));
}

function mostrarImport() {
  $('vRes').classList.add('hidden'); $('ctxWrap').classList.add('hidden'); $('vImport').classList.remove('hidden');
  $('acts').classList.add('hidden'); renderImport(); window.scrollTo(0, 0);
}
function abrir(i) {
  idxAtual = i; A = relatorios[i].A; aba = 'resumo'; semSel = 0; filtro = 'todos'; modoDias = 'tab';
  const comIssue = A.semanas.findIndex(w => w.issues); semSel = comIssue >= 0 ? comIssue : 0;
  $('vImport').classList.add('hidden'); $('vRes').classList.remove('hidden'); $('ctxWrap').classList.remove('hidden'); $('acts').classList.remove('hidden');
  renderCtx(); renderAba(); window.scrollTo(0, 0);
}

// ---------- cabeçalho e abas ----------
function renderCtx() {
  const { emp, issues } = A;
  const cargo = titulo((emp.cargo.split(' - ')[0] || '').trim());
  const lot = titulo(emp.lotacao.replace(/\s*\(\d+\)\s*$/, ''));
  const hom = emp.homologada.match(/HOMOLOGADA:\s*(.*?)\s+em\s+([\d/]+)/i);
  $('ctx').innerHTML = `
    <div class="ctx-l"><h1>${esc(titulo(emp.nome))}</h1><span class="ctx-meta">Mat. ${esc(emp.matricula)} · ${esc(cargo)} · ${esc(lot)} · ${Math.round(A.semanal / 60)}h semanais</span></div>
    <div class="ctx-r">${emp.tipo === 'espelho' ? '<span class="chip c-inf">Espelho de Ponto</span>' : ''}<span class="comp">${cap(MESES[emp.mes])}/${emp.ano}</span>${hom ? `<span class="chip c-ok" title="Homologada por ${esc(titulo(hom[1]))}">Homologada em ${esc(hom[2].slice(0, 5))}</span>` : '<span class="chip c-ver">Não homologada</span>'}</div>`;
  const c = contagem(issues);
  const nDiv = A.dias.filter(d => d.valid.status === 'diverge' || d.valid.status === 'incompleto').length;
  const T = [['resumo', 'Resumo', 'Resumo'], ['semanas', 'Semanas', 'Semanas'], ['dia', 'Dia a dia', 'Dia a dia'], ['pontos', 'Pontos de atenção', 'Pontos'], ['conf', 'Conferência', 'Conf.']];
  $('tabs').innerHTML = T.map(([id, longo, curto]) => `<button class="tab" role="tab" data-aba="${id}" aria-selected="${aba === id}"><span class="longo">${longo}</span><span class="curto">${curto}</span>${id === 'dia' && nDiv ? `<span class="badge b-aj n" aria-label="${nDiv} dias com problema">${nDiv}</span>` : ''}${id === 'pontos' ? `${c.aj ? `<span class="badge b-aj n" aria-label="${c.aj} para ajustar">${c.aj}</span>` : ''}${c.ver ? `<span class="badge b-ver n" aria-label="${c.ver} para verificar">${c.ver}</span>` : ''}` : ''}</button>`).join('');
}
$('tabs').addEventListener('click', e => { const b = e.target.closest('[data-aba]'); if (b) { aba = b.dataset.aba; renderAba(); } });
function irPara(novaAba, extra) { aba = novaAba; Object.assign(window, {}); if (extra) extra(); renderAba(); window.scrollTo(0, 0); }
function renderAba() {
  $('tabs').querySelectorAll('[data-aba]').forEach(b => b.setAttribute('aria-selected', b.dataset.aba === aba));
  ({ resumo: renderResumo, semanas: renderSemanas, dia: renderDiaADia, pontos: renderPontos, conf: renderConf })[aba]();
}

// ---------- textos de "por que o saldo deu" ----------
const listaDias = ds => ds.map(dd).join(', ').replace(/, ([^,]*)$/, ' e $1') + '/' + dd(A.emp.mes + 1);
const periodo = ds => ds.length > 2 && ds[ds.length - 1] - ds[0] === ds.length - 1 ? `${dd(ds[0])} a ${dd(ds[ds.length - 1])}/${dd(A.emp.mes + 1)}` : listaDias(ds);
function linhasSaldo() {
  const { M, partes } = A;
  const erros = A.issues.filter(i => i.tipo === 'hc-divergente');
  const out = [];
  partes.forEach(p => {
    const g = p.g;
    if (p.id === 'ponto') out.push({ v: p.v, t: p.v > 0 ? 'Ficou além do horário nos plantões.' : p.v < 0 ? 'Ficou abaixo do horário nos plantões.' : 'O ponto bateu com a escala nos plantões.', d: 'É a soma da coluna Saldo Diário.',
      alerta: erros.length ? `${sinal(erros.reduce((a, i) => a + (i.impacto || 0), 0))} disso é de erro em ${erros.map(i => i.data.replace(/^\w+, /, '')).join(', ')}.` : '' });
    else if (p.id === 'escala') { if (p.v) out.push({ v: p.v, t: `A escala teve ${p.v > 0 ? 'mais' : 'menos'} horas que o contrato nos dias trabalhados.`, d: `${fmt(p.esc)} escaladas × ${fmt(p.con)} do contrato.` }); }
    else if (p.id === 'outros-trab') out.push({ v: p.v, t: 'Outros créditos em dias sem código de jornada.', d: '' });
    else if (p.id === 'resid') out.push({ v: p.v, t: 'Outros ajustes do relatório.', d: '' });
    else if (p.tipo === 'falta') out.push({ v: p.v, t: `${g.dias.length > 1 ? 'Faltas' : 'Falta'} (${listaDias(g.dias)}).`, d: 'O dia não foi trabalhado: as horas do contrato ficaram faltando.' });
    else if (p.tipo === 'feriado') out.push({ v: p.v, t: `${g.dias.length > 1 ? 'Feriados' : 'Feriado'} (${listaDias(g.dias)}) sem plantão.`, d: 'O dia é abonado no contrato e ainda recebe crédito da CH diária.' });
    else if (p.tipo === 'afast') {
      const nome = /^f[ée]rias$/i.test(g.nome) ? 'Férias' : g.nome;
      out.push({ v: p.v, t: `${nome} (${periodo(g.dias)}).`, d: p.v === 0 ? 'O crédito foi igual ao contrato. Não muda o saldo.' : `A escala registrada no período (${fmt(g.hc)}) ficou ${p.v > 0 ? 'acima' : 'abaixo'} do contrato desses dias (${fmt(g.contratual)}).` });
    } else if (p.tipo === 'pag') {
      if (g.modo === 'excedente') out.push({ v: p.v, t: `Extensão de jornada (${listaDias(g.dias)}).`, d: 'O dia conta o plantão da escala; o tempo além dele foi pago.' });
      else out.push({ v: p.v, t: `${g.nome.replace('Plantão de sobreaviso', 'Sobreaviso')} (${listaDias(g.dias)}).`, d: p.v < 0 ? 'O tempo foi pago e não entra no saldo. As horas do contrato desses dias ficaram faltando.' : 'O tempo foi pago e não entra no saldo.' });
    }
  });
  let concl = '';
  const T = A.trabalho, cobre = A.grupos.filter(g => (g.tipo === 'feriado' || g.tipo === 'afast') && g.v > 0);
  if (T.v < 0 && M.saldo >= 0 && cobre.length) {
    const nomes = cobre.map(g => g.tipo === 'feriado' ? (g.dias.length > 1 ? 'os feriados' : 'o feriado') : /^f[ée]rias$/i.test(g.nome) ? 'as férias' : 'o afastamento');
    concl = `O saldo só ficou ${M.saldo > 0 ? 'positivo' : 'zerado'} porque ${nomes.join(' e ')} ${nomes.length > 1 || /^(os|as) /.test(nomes[0]) ? 'cobriram' : 'cobriu'} a diferença dos dias trabalhados.`;
  }
  return { linhas: out, concl };
}

// ---------- aba Resumo ----------
function renderResumo() {
  const { M, semanas, issues } = A;
  const c = contagem(issues);
  const erros = issues.filter(i => i.tipo === 'hc-divergente');
  const { linhas, concl } = linhasSaldo();
  const nUteis = A.dias.filter(d => d.contratual).length;
  const alerta = erros.length
    ? `<strong>${erros.map(i => i.data.replace(/^\w+, /, '')).join(', ')}:</strong> horas consideradas incompatíveis com os registros (<span class="n">${sinal(M.impactoInconsist)}</span> no saldo).`
    : c.aj ? `${c.aj} ${plural(c.aj, 'ponto precisa', 'pontos precisam')} de ajuste antes de fechar o saldo.` : '';
  $('vRes').innerHTML = `
    ${alerta ? `<div class="alert">${ICO_W}<span>${alerta}</span><button class="lnk" style="color:var(--aj)" data-ir="pontos">Ver pontos de atenção</button></div>` : ''}
    <section class="panel tot" aria-label="Totais do mês">
      <div><div class="k">Saldo do mês</div><div class="v big n ${cls(M.saldo)}">${sinal(M.saldo) || '00:00'}</div><div class="s">${erros.length ? 'como está no relatório' : 'consideradas − contratual'}</div></div>
      ${erros.length ? `<div style="background:#FBFCFE"><div class="k">Saldo após ajuste</div><div class="v big n ${cls(M.saldoCorrigido)}">≈ ${sinal(M.saldoCorrigido) || '00:00'}</div><div class="s">sem o erro de ${erros.map(i => i.data.replace(/^\w+, /, '')).join(', ')}</div></div>` : ''}
      <div><div class="k"><i style="background:var(--contr)"></i>CH contratual</div><div class="v n">${fmt(M.contratual)}</div><div class="s n">${nUteis} dias × ${fmt(A.diaria)}</div></div>
      <div><div class="k"><i style="background:var(--cons)"></i>Horas consideradas</div><div class="v n">${fmt(M.hc)}</div><div class="s">soma da coluna HC</div></div>
    </section>
    <section class="panel">
      <div class="panel-h" style="padding-bottom:4px;flex-direction:column;align-items:flex-start;gap:2px"><h2>Por que o saldo deu ${sinal(M.saldo) || '00:00'}</h2><p class="muted" style="font-size:13px">Leia de cima para baixo, como uma conta.</p></div>
      <ol class="conta-saldo">${linhas.map(l => `<li><span class="val n ${cls(l.v)}">${sinal(l.v) || '00:00'}</span><div><strong>${esc(l.t)}</strong> ${esc(l.d)}${l.alerta ? `<div class="warn">${ICO_W}<span>${esc(l.alerta)}</span></div>` : ''}</div></li>`).join('')}</ol>

    <td class="n g-dev" style="font-size:13px">${es}</td>
    <td class="r n g-dev ${div && !v.hcOk ? 'cel-ok' : ''}">${hcDev}</td>
    <td class="r n g-dev ${div && !v.saldoOk ? 'cel-ok' : v.saldo != null ? cls(v.saldo) : 'zero'}" style="font-weight:700">${sDev}</td>
    ${A.emp.tipo === 'espelho' ? `<td class="r n g-dev ${d.extrasEsp != null && Math.abs((d.extras || 0) - d.extrasEsp) > 10 ? 'cel-ok' : ''}">${d.extrasEsp != null ? fmt(d.extrasEsp) : d.pagamento && !d.sobreaviso ? '?' : '—'}</td><td class="r n g-dev ${d.adnotEsp != null && Math.abs((d.adnot || 0) - d.adnotEsp) > 10 ? 'cel-ok' : ''}">${d.adnotEsp != null ? fmt(d.adnotEsp) : '—'}</td>` : ''}
    <td style="min-width:230px"><span class="chip ${sc}">${st}</span><div style="font-size:12px;color:var(--txt2);margin-top:3px">${esc(v.motivo)}${linkPonto}</div></td></tr>`;
}
function itemDiaADia(d) {
  const v = d.valid, [sc, st] = ST[v.status] || ST.ok, div = v.status === 'diverge';
  return `<li class="${div || v.status === 'incompleto' ? 'r-aj' : ''}">
    <div class="dl-h"><span><strong class="n">${DOWC[d.dow]} ${dd(d.dia)}</strong> <span class="muted n">${esc(v.escala)}</span></span><span class="chip ${sc}">${st}</span></div>
    <div class="cmp2"><span class="lb">Como está</span><span>${batidasEsta(d)}</span><span class="n ${div && !v.hcOk ? 'cel-err' : ''}">${d.hc ? fmt(d.hc) : '00:00'}</span><span class="n ${div && !v.saldoOk ? 'cel-err' : ''}" style="font-weight:700">${d.saldo != null ? sinal(d.saldo) || '00:00' : '—'}</span></div>
    <div class="cmp2"><span class="lb">Deveria</span><span class="n" style="font-size:12px">${v.entrada ? esc(v.entrada) + ' → ' + (v.saida ? esc(v.saida) : 'falta a saída') : '—'}</span><span class="n ${div && !v.hcOk ? 'cel-ok' : ''}">${v.hc == null ? '?' : fmt(v.hc)}</span><span class="n ${div && !v.saldoOk ? 'cel-ok' : ''}" style="font-weight:700">${v.hc == null ? '?' : v.saldo != null ? sinal(v.saldo) || '00:00' : '—'}</span></div>
    <div style="font-size:12px" class="muted">${esc(v.motivo)}</div></li>`;
}
function renderDiaADia() {
  const { semanas, dias } = A, mm = dd(A.emp.mes + 1);
  const cont = k => dias.filter(d => d.valid.status === k).length;
  const prob = d => d.valid.status !== 'ok';
  const nProb = dias.filter(prob).length;
  const grupos = semanas.map(w => ({ w, ds: w.dias.filter(d => !soProblemas || prob(d)) })).filter(g => g.ds.length);
  const resumo = [[cont('ok'), 'conferem', 'var(--ok)'], [cont('diverge'), plural(cont('diverge'), 'diverge', 'divergem'), 'var(--aj)'], [cont('incompleto'), 'com batida faltando', 'var(--aj)'], [cont('atencao'), 'para verificar', 'var(--ver)'], [cont('info'), 'informação', 'var(--txt3)']].filter(x => x[0]);
  $('vRes').innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap">
      <div><h2 style="font-size:18px;font-weight:700">Conferência dia a dia</h2>
        <p class="muted" style="font-size:13px;margin-top:2px">${dias.length} dias: ${resumo.map(([n, t, c]) => `<strong class="n" style="color:${c}">${n}</strong> ${t}`).join(' · ')}</p></div>
      <div class="seg" role="group" aria-label="Mostrar"><button data-sp="0" aria-pressed="${!soProblemas}">Todos os dias</button><button data-sp="1" aria-pressed="${soProblemas}">Só com problema (${nProb})</button></div>
    </div>
    <section class="panel">
      ${grupos.length ? `<div class="tbox tbl-dias"><table class="t" style="min-width:${A.emp.tipo === 'espelho' ? 1400 : 1120}px">
        <caption class="sr">Conferência de cada dia: como está no relatório e como deveria ser</caption>
        <thead>
          <tr><th scope="col" rowspan="2" style="width:84px">Dia</th><th scope="col" rowspan="2">Escala</th><th scope="colgroup" colspan="${A.emp.tipo === 'espelho' ? 5 : 3}" class="gh-esta">COMO ESTÁ NO RELATÓRIO</th><th scope="colgroup" colspan="${A.emp.tipo === 'espelho' ? 5 : 3}" class="gh-dev">COMO DEVERIA SER</th><th scope="col" rowspan="2">Situação</th></tr>
          <tr><th scope="col" class="g-esta">Batidas</th><th scope="col" class="r g-esta">Horas</th><th scope="col" class="r g-esta">Saldo</th>${A.emp.tipo === 'espelho' ? '<th scope="col" class="r g-esta">Extras</th><th scope="col" class="r g-esta">Ad. Not.</th>' : ''}<th scope="col" class="g-dev">Entrada → saída</th><th scope="col" class="r g-dev">Horas</th><th scope="col" class="r g-dev">Saldo</th>${A.emp.tipo === 'espelho' ? '<th scope="col" class="r g-dev">Extras</th><th scope="col" class="r g-dev">Ad. Not.</th>' : ''}</tr>
        </thead>
        <tbody>${grupos.map(g => `<tr class="sub"><td colspan="${A.emp.tipo === 'espelho' ? 13 : 9}">Semana ${g.w.n} <span class="muted n" style="font-weight:500">· ${g.w.periodo}/${mm}</span></td></tr>` + g.ds.map(linhaDiaADia).join('')).join('')}</tbody>
      </table></div>
      <ul class="dlist">${grupos.map(g => `<li style="background:var(--bg);font-weight:700;font-size:13px">Semana ${g.w.n} · ${g.w.periodo}/${mm}</li>` + g.ds.map(itemDiaADia).join('')).join('')}</ul>`
      : '<p style="padding:20px"><strong>Todos os dias conferem.</strong> <span class="muted">As horas e o saldo de cada dia batem com os registros.</span></p>'}
      <p class="panel-f">“Como deveria ser” junta entrada e saída de cada plantão (inclusive o noturno, que termina no dia seguinte), soma a hora noturna (7min30s por hora entre 22h e 5h) e aplica a tolerância de 5 min por batida. Batidas marcadas <span class="b ant" style="display:inline-flex">ant.</span> são a saída do plantão do dia anterior; <span class="b dup" style="display:inline-flex">rep.</span> são repetidas; riscadas foram canceladas.</p>
    </section>`;
}

// ---------- aba Pontos de atenção ----------
function visual(v) {
  if (!v) return '';
  if (v.tipo === 'batidas') return `<ul class="bat">${v.itens.map(b => `<li class="${b.estado}"><strong class="n">${esc(b.h)}</strong> ${esc(b.t)}</li>`).join('')}</ul>`;
  if (v.tipo === 'conta') return `<table class="cta"><caption class="sr">Conta</caption><tbody>${v.linhas.map(l => {
    const valCls = l.t === 'total' ? (String(l.v).startsWith('−') ? 'neg' : String(l.v).startsWith('+') ? 'pos' : '') : '';
    return `<tr class="t-${l.t || 'norm'}"><td>${esc(l.l)}</td><td class="n ${valCls}">${esc(l.v)}</td></tr>`;
  }).join('')}</tbody></table>`;
  if (v.tipo === 'faixa') return `<div class="fx" aria-hidden="true">${v.segs.map(s => `<div class="${s.kind}" style="flex:${s.f}">${esc(s.t)}</div>`).join('')}</div><p class="fx-n n">${esc(v.nota)}</p>`;
  if (v.tipo === 'plantao') return `<div class="pl-top"><span class="n"><strong>Entrada</strong> ${esc(v.ent)}</span><span class="n"><strong>Saída</strong> ${esc(v.sai)}</span></div><div class="pl-bar" aria-hidden="true"></div><div class="n" style="font-size:13px;text-align:center">${esc(v.conta)}</div>
    <div class="cmp">${v.barras.map(b => `<span>${esc(b.l)}</span><div class="tr" aria-hidden="true"><div style="width:${b.pct}%;background:${b.erro ? '#D5332C' : 'var(--cons)'}"></div></div><strong class="n" style="${b.erro ? 'color:var(--aj)' : ''}">${esc(b.v)}</strong>`).join('')}</div>`;
  return '';
}
function cartao(i) {
  const [c, nome] = NIVEL[i.nivel];
  const temDia = !i.mes && /\d/.test(i.data) && !/ a /.test(i.data);
  const ref = [i.onde, i.ref ? 'Checklist ' + i.ref : i.refTxt].filter(Boolean).join(' · ');
  return `<article class="pc ${i.nivel === 'ajustar' ? 'aj' : ''}">
    <div class="pc-h"><span class="chip ${c}">${nome}</span><span class="dt n">${esc(i.data)}</span><h3>${esc(i.titulo)}</h3>${temDia ? `<button class="lnk" data-dia="${i.dia}">Ver dia</button>` : ''}</div>
    <div class="pc-b">
      <div><div class="pc-l">1 · O QUE ACONTECEU</div><p>${esc(i.aconteceu)}</p></div>
      <div><div class="pc-l">2 · ${i.visual?.tipo === 'conta' ? 'A CONTA' : i.visual?.tipo === 'faixa' ? 'NA ESCALA' : 'NOS REGISTROS'}</div>${visual(i.visual)}</div>
      <div><div class="pc-l">3 · O QUE FAZER</div><p>${esc(i.fazer)}</p>${ref ? `<p class="pc-ref">${esc(ref)}</p>` : ''}</div>
    </div>
    ${i.tipo === 'hc-divergente' ? `<div class="pc-f">Efeito no saldo do mês: <strong style="color:var(--aj)">${sinal(i.impacto)} a mais</strong>. O saldo do dia deveria ser <strong class="${cls(i.esperado)}">${sinal(i.esperado) || '00:00'}</strong>.</div>` : ''}
  </article>`;
}
function renderPontos() {
  const { issues } = A;
  const c = contagem(issues), nInf = issues.filter(i => i.nivel === 'info').length;
  const vis = issues.filter(i => filtro === 'todos' || i.nivel === filtro);
  const doMes = vis.filter(i => i.mes && i.nivel !== 'info'), porDia = vis.filter(i => !i.mes && i.nivel !== 'info'), infos = vis.filter(i => i.nivel === 'info');
  const pags = A.grupos.filter(g => g.tipo === 'pag');
  const F = [['todos', 'Todos', issues.length], ['ajustar', 'Ajustar', c.aj], ['verificar', 'Verificar', c.ver], ['info', 'Informação', nInf]];
  $('vRes').innerHTML = `
    <div class="filt" role="group" aria-label="Filtrar por nível">${F.map(([f, n, q]) => `<button data-f="${f}" aria-pressed="${filtro === f}">${n} <span class="n">${q}</span></button>`).join('')}</div>
    ${!issues.length ? '<div class="panel" style="padding:20px"><strong>Nenhum ponto de atenção.</strong> <span class="muted">Os registros e a escala não mostram inconsistências.</span></div>' : ''}
    ${doMes.length ? `<div class="grp-t">DO MÊS</div>${doMes.map(cartao).join('')}` : ''}
    ${porDia.length ? `<div class="grp-t">POR DIA</div>${porDia.map(cartao).join('')}` : ''}
    ${infos.length ? `<div class="grp-t">INFORMAÇÕES</div>${infos.map(i => `<div class="info-row"><span class="chip c-inf">Informação</span><span class="dt n muted" style="font-size:13px;font-weight:700">${esc(i.data)}</span><span class="tx"><strong>${esc(i.titulo)}.</strong> ${esc(i.visual?.tipo === 'conta' && i.tipo === 'ressalva' ? i.visual.linhas[0].v : i.fazer)}</span>${!i.mes ? `<button class="lnk" data-dia="${i.dia}">Ver dia</button>` : ''}</div>`).join('')}` : ''}
    ${pags.length ? `<p style="font-size:13px;color:var(--txt3)"><strong>Não são problemas</strong> (foram pagos): ${pags.map(g => `${esc((PAG_CURTO[g.nome] || g.nome).toLowerCase())} <span class="n">${esc(listaDias(g.dias))}</span>`).join(' · ')}.</p>` : ''}`;
}

// ---------- aba Conferência ----------
function renderConf() {
  const { conf, emp } = A;
  const nomes = { 'Ad. Noturno': ['Adicional noturno', 'var(--txt2)'], 'Horas extras': ['Horas extras', 'var(--txt2)'], 'Horas em feriado': ['Horas em feriado', 'var(--txt2)'], 'CH Contratual Mês': ['CH contratual', 'var(--contr)'], 'CH Escalada Mês': ['CH escalada', 'var(--esc)'], 'CH Executada': ['Horas consideradas', 'var(--cons)'], 'Saldo do mês': ['Saldo do mês', 'var(--txt)'] };
  const escDif = conf.find(c => c.item === 'CH Escalada Mês' && !c.ok);
  const jornadas = Object.values(emp.jornadas);
  const diasTxt = A.diasContrat.length >= 7 ? 'todos os dias' : `${DIAS_NOME[A.diasContrat[0]].slice(0, 3).toLowerCase()} a ${DIAS_NOME[A.diasContrat.at(-1)].slice(0, 3).toLowerCase()}`;
  $('vRes').innerHTML = `<div class="conf-wrap">
    <section class="panel">
      <div class="panel-h"><h2>Totais recalculados × relatório</h2></div>
      ${conf.length ? `<div class="tbox"><table class="t" style="min-width:520px"><caption class="sr">Conferência dos totais com o PDF</caption>
        <thead><tr><th scope="col">Total</th><th scope="col" class="r">Recalculado</th><th scope="col" class="r">No relatório</th><th scope="col">Situação</th></tr></thead>
        <tbody>${conf.map(c => { const [n, cor] = nomes[c.item] || [c.item, 'var(--txt)']; const sal = c.item === 'Saldo do mês';
          return `<tr><th scope="row"><span style="display:inline-flex;align-items:center;gap:8px"><span style="width:4px;height:18px;border-radius:2px;background:${cor}"></span>${n}</span></th>
          <td class="r n">${sal ? sinal(c.calc) : fmt(c.calc)}</td><td class="r n">${sal ? sinal(c.rel) : fmt(c.rel)}</td>
          <td style="font-size:13px;font-weight:600;color:${c.ok ? 'var(--ok)' : c.essencial ? 'var(--aj)' : 'var(--ver)'}">${c.ok ? '✓ Confere' : 'Difere ' + fmt(Math.abs(c.calc - c.rel))}</td></tr>`; }).join('')}</tbody></table></div>` : '<p style="padding:0 20px 16px" class="muted">O relatório não trouxe o quadro de totais.</p>'}
      ${escDif ? '<p class="panel-f">A diferença na CH escalada não altera o saldo.</p>' : ''}${conf.some(c => !c.ok && !c.essencial && c.item !== 'CH Escalada Mês') ? '<p class="panel-f">Os totais do rodapé do espelho podem incluir lançamentos que não aparecem na tabela diária. Não alteram o saldo.</p>' : ''}${A.emp.tipo === 'espelho' ? '<p class="panel-f">O Espelho de Ponto não traz a CH escalada do mês.</p>' : ''}
    </section>
    <section class="panel">
      <h2 style="font-size:16px;font-weight:700;margin-bottom:10px">Como o cálculo é feito</h2>
      <dl class="regras">
        <dt>Contratual</dt><dd>${fmt(A.diaria)} por dia útil (${diasTxt}), sem feriados</dd>
        <dt>Escalada</dt><dd>CH de cada código de jornada do mês${jornadas.length ? ` (${jornadas.map(j => j.codigo + ': ' + fmt(j.ch)).join(', ')})` : ''}</dd>
        <dt>Consideradas</dt><dd>Soma da coluna HC do relatório</dd>
        <dt>Saldo</dt><dd>Consideradas − contratual</dd>
        <dt>Hora ficta</dt><dd>7min30s por hora noturna (22h às 5h)</dd>
        <dt>Registros</dt><dd>Só até 3h antes e 3h depois da jornada</dd>
        <dt>Pagamento</dt><dd>Extensão: saldo do dia desconsiderado. Sobreaviso e jornada extraordinária: todo o tempo do dia</dd>
      </dl>
      <p style="margin-top:12px;font-size:12px" class="muted">Pontos de atenção seguem o checklist do POP.DGP.127, Anexo III.</p>
    </section></div>`;
}

// ---------- resumo para o empregado ----------
function resumoTexto() {
  const { emp, M, semanas, issues } = A;
  const { linhas, concl } = linhasSaldo();
  const L = [];
  L.push(`Análise de saldo – ${cap(MESES[emp.mes])}/${emp.ano}`);
  L.push(`${titulo(emp.nome)} – matrícula ${emp.matricula}`);
  L.push('');
  L.push(`Saldo do mês: ${sinal(M.saldo) || '00:00'} (${fmt(M.hc)} horas consideradas − ${fmt(M.contratual)} de CH contratual).`);
  L.push(`Soma da coluna Saldo Diário: ${sinal(M.saldoDiario) || '00:00'}.`);
  L.push('');
  L.push(`Por que o saldo deu ${sinal(M.saldo) || '00:00'}:`);
  linhas.forEach(l => L.push(`• ${(sinal(l.v) || '00:00').padEnd(7)} ${l.t} ${l.d}${l.alerta ? ' Atenção: ' + l.alerta : ''}`.trim()));
  if (concl) L.push(concl);
  const pend = issues.filter(i => i.nivel !== 'info');
  if (pend.length) {
    L.push(''); L.push('Pontos de atenção:');
    pend.forEach(i => L.push(`• ${i.data} – ${i.titulo} (${i.nivel}). ${i.aconteceu} O que fazer: ${i.fazer}`));
    if (M.impactoInconsist) L.push(`Corrigidas as horas incompatíveis, o saldo ficaria em torno de ${sinal(M.saldoCorrigido) || '00:00'}.`);
  }
  L.push(''); L.push('Semanas:');
  semanas.forEach(w => L.push(`• Semana ${w.n} (${w.periodo}): contratual ${fmt(w.contratual)}, escalada ${fmt(w.escalada + w.credito)}, consideradas ${fmt(w.hc)}, saldo ${sinal(w.saldo) || '00:00'}.`));
  return L.join('\n');
}
let ultimoFoco = null;
function abrirResumo() { ultimoFoco = document.activeElement; $('resumoTxt').value = resumoTexto(); $('overlay').classList.remove('hidden'); $('resumoTxt').focus(); $('resumoTxt').setSelectionRange(0, 0); $('resumoTxt').scrollTop = 0; }
function fecharResumo() { $('overlay').classList.add('hidden'); ultimoFoco && ultimoFoco.focus(); }
function toast(t) { const el = $('toast'); el.textContent = t; el.classList.remove('hidden'); clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.add('hidden'), 2800); }
$('btnResumo').onclick = abrirResumo;
$('btnFechar').onclick = fecharResumo; $('btnCancelar').onclick = fecharResumo;
$('overlay').addEventListener('click', e => { if (e.target === $('overlay')) fecharResumo(); });
$('overlay').addEventListener('keydown', e => { if (e.key === 'Escape') fecharResumo(); });
$('btnCopiar').onclick = async () => { const t = $('resumoTxt').value; try { await navigator.clipboard.writeText(t); toast('Texto copiado. Cole no e-mail ou no SEI.'); } catch { $('resumoTxt').select(); toast('Texto selecionado: use Ctrl+C para copiar.'); } };
$('btnRel').onclick = mostrarImport;

// ---------- arrastar e soltar ----------
const drop = $('drop'), inp = $('file');
inp.addEventListener('change', () => { importar(inp.files); inp.value = ''; });
drop.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); inp.click(); } });
['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => importar(e.dataTransfer.files));
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => e.preventDefault());
</script>
</body>
